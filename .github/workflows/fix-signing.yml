name: Fix Signing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create fixed debug key and use it
        run: |
          set -e
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -keystore app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if ! grep -q "debug.keystore" app/build.gradle.kts; then
            cat >> app/build.gradle.kts <<'NEXORA_EOF'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          NEXORA_EOF
          fi
          git config user.name "nexora-bot"
          git config user.email "nexora-bot@users.noreply.github.com"
          git add -f app/debug.keystore app/build.gradle.kts
          git commit -m "Use fixed debug signing key" || true
          git push
