name: Setup Stage 1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/nexora/circle/ui/theme
          mkdir -p app/src/main/java/com/nexora/circle/ui/screens
          mkdir -p app/src/main/java/com/nexora/circle/ui/components
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'NEXORA_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NEXORA-CIRCLE"
          include(":app")
          NEXORA_EOF

          cat > build.gradle.kts <<'NEXORA_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }
          NEXORA_EOF

          cat > gradle.properties <<'NEXORA_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          NEXORA_EOF

          cat > app/build.gradle.kts <<'NEXORA_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          // Firebase is wired in Stage 2. The plugin only activates once a valid google-services.json exists.
          if (file("google-services.json").exists()) {
              apply(plugin = "com.google.gms.google-services")
          }

          android {
              namespace = "com.nexora.circle"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.nexora.circle"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.03")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.navigation:navigation-compose:2.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.datastore:datastore-preferences:1.1.1")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          NEXORA_EOF

          echo "# NEXORA-CIRCLE release rules" > app/proguard-rules.pro

          cat > app/src/main/AndroidManifest.xml <<'NEXORA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Nexora">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          NEXORA_EOF

          cat > app/src/main/res/values/strings.xml <<'NEXORA_EOF'
          <resources>
              <string name="app_name">NEXORA-CIRCLE</string>
          </resources>
          NEXORA_EOF

          cat > app/src/main/res/values/colors.xml <<'NEXORA_EOF'
          <resources>
              <color name="nexora_bg">#0E0E12</color>
          </resources>
          NEXORA_EOF

          cat > app/src/main/res/values/themes.xml <<'NEXORA_EOF'
          <resources>
              <style name="Theme.Nexora" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/nexora_bg</item>
              </style>
          </resources>
          NEXORA_EOF

          cat > app/src/main/java/com/nexora/circle/MainActivity.kt <<'NEXORA_EOF'
          package com.nexora.circle

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.nexora.circle.ui.NexoraApp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent { NexoraApp() }
              }
          }
          NEXORA_EOF

          cat > app/src/main/java/com/nexora/circle/ui/theme/ThemeSettings.kt <<'NEXORA_EOF'
          package com.nexora.circle.ui.theme

          enum class ThemeMode(val label: String) {
              LIGHT("Light"),
              DARK("Dark"),
              OLED("OLED Black")
          }

          data class AccentPreset(val name: String, val argb: Int)

          object AccentPresets {
              val Pink = AccentPreset("Pink", 0xFFFF3EB5.toInt())
              val Purple = AccentPreset("Purple", 0xFF9B6BFF.toInt())
              val Blue = AccentPreset("Blue", 0xFF3E8BFF.toInt())
              val Green = AccentPreset("Green", 0xFF2ECC8F.toInt())
              val all = listOf(Pink, Purple, Blue, Green)
          }

          data class ThemeSettings(
              val mode: ThemeMode = ThemeMode.DARK,
              val accentArgb: Int = AccentPresets.Pink.argb,
              val cornerRadiusDp: Int = 20,
              val fontScale: Float = 1.0f
          )

          fun argbToHex(argb: Int): String = "%06X".format(argb and 0xFFFFFF)
          NEXORA_EOF

          cat > app/src/main/java/com/nexora/circle/ui/theme/ThemeRepository.kt <<'NEXORA_EOF'
          package com.nexora.circle.ui.theme

          import android.content.Context
          import androidx.datastore.preferences.core.edit
          import androidx.datastore.preferences.core.emptyPreferences
          import androidx.datastore.preferences.core.floatPreferencesKey
          import androidx.datastore.preferences.core.intPreferencesKey
          import androidx.datastore.preferences.core.stringPreferencesKey
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.catch
          import kotlinx.coroutines.flow.map
          import java.io.IOException

          private val Context.themeDataStore by preferencesDataStore(name = "nexora_theme")

          class ThemeRepository(private val context: Context) {

              private object Keys {
                  val MODE = stringPreferencesKey("mode")
                  val ACCENT = intPreferencesKey("accent")
                  val CORNER = intPreferencesKey("corner")
                  val FONT_SCALE = floatPreferencesKey("font_scale")
              }

              val settings: Flow<ThemeSettings> = context.themeDataStore.data
                  .catch { e -> if (e is IOException) emit(emptyPreferences()) else throw e }
                  .map { p ->
                      val defaults = ThemeSettings()
                      ThemeSettings(
                          mode = p[Keys.MODE]
                              ?.let { name -> runCatching { ThemeMode.valueOf(name) }.getOrNull() }
                              ?: defaults.mode,
                          accentArgb = p[Keys.ACCENT] ?: defaults.accentArgb,
                          cornerRadiusDp = p[Keys.CORNER] ?: defaults.cornerRadiusDp,
                          fontScale = p[Keys.FONT_SCALE] ?: defaults.fontScale
                      )
                  }

              suspend fun save(s: ThemeSettings) {
                  context.themeDataStore.edit { p ->
                      p[Keys.MODE] = s.mode.name
                      p[Keys.ACCENT] = s.accentArgb
                      p[Keys.CORNER] = s.cornerRadiusDp
                      p[Keys.FONT_SCALE] = s.fontScale
                  }
              }
          }
          NEXORA_EOF

          cat > app/src/main/java/com/nexora/circle/ui/theme/ThemeViewModel.kt <<'NEXORA_EOF'
          package com.nexora.circle.ui.theme

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch

          class ThemeViewModel(app: Application) : AndroidViewModel(app) {
              private val repository = ThemeRepository(app)

              val settings: StateFlow<ThemeSettings> = repository.settings
                  .stateIn(viewModelScope, SharingStarted.Eagerly, ThemeSettings())

              fun save(settings: ThemeSettings) {
                  viewModelScope.launch { repository.save(settings) }
              }
          }
          NEXORA_EOF

          cat > app/src/main/java/com/nexora/circle/ui/theme/NexoraTheme.kt <<'NEXORA_EOF'
          package com.nexora.circle.ui.theme

          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.ColorScheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Shapes
          import androidx.compose.material3.Typography
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.lerp
          import androidx.compose.ui.graphics.luminance
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.unit.Density
          import androidx.compose.ui.unit.dp

          fun buildColorScheme(s: ThemeSettings): ColorScheme {
              val accent = Color(s.accentArgb)
              val onAccent = if (accent.luminance() > 0.5f) Color.Black else Color.White
              return when (s.mode) {
                  ThemeMode.LIGHT -> lightColorScheme(
                      primary = accent,
                      onPrimary = onAccent,
                      primaryContainer = lerp(Color.White, accent, 0.18f),
                      onPrimaryContainer = Color(0xFF16161C),
                      secondary = accent,
                      onSecondary = onAccent,
                      background = Color(0xFFFAF9FB),
                      onBackground = Color(0xFF16161C),
                      surface = Color.White,
                      onSurface = Color(0xFF16161C),
                      surfaceVariant = Color(0xFFEDEBF0),
                      onSurfaceVariant = Color(0xFF5E5C66),
                      outline = Color(0xFFCFCCD6),
                      surfaceContainerLow = Color(0xFFF5F3F7),
                      surfaceContainer = Color(0xFFF1EFF4),
                      surfaceContainerHigh = Color(0xFFEDEBF0),
                      surfaceContainerHighest = Color(0xFFE8E6EC)
                  )

                  ThemeMode.DARK -> darkColorScheme(
                      primary = accent,
                      onPrimary = onAccent,
                      primaryContainer = lerp(Color(0xFF16161C), accent, 0.28f),
                      onPrimaryContainer = Color(0xFFF2F2F6),
                      secondary = accent,
                      onSecondary = onAccent,
                      background = Color(0xFF0E0E12),
                      onBackground = Color(0xFFECECF1),
                      surface = Color(0xFF16161C),
                      onSurface = Color(0xFFECECF1),
                      surfaceVariant = Color(0xFF22222B),
                      onSurfaceVariant = Color(0xFFA9A8B3),
                      outline = Color(0xFF3A3A46),
                      surfaceContainerLow = Color(0xFF13131A),
                      surfaceContainer = Color(0xFF181820),
                      surfaceContainerHigh = Color(0xFF1E1E27),
                      surfaceContainerHighest = Color(0xFF252530)
                  )

                  ThemeMode.OLED -> darkColorScheme(
                      primary = accent,
                      onPrimary = onAccent,
                      primaryContainer = lerp(Color.Black, accent, 0.28f),
                      onPrimaryContainer = Color(0xFFF2F2F6),
                      secondary = accent,
                      onSecondary = onAccent,
                      background = Color.Black,
                      onBackground = Color(0xFFECECF1),
                      surface = Color(0xFF0A0A0A),
                      onSurface = Color(0xFFECECF1),
                      surfaceVariant = Color(0xFF1A1A1A),
                      onSurfaceVariant = Color(0xFFA0A0A8),
                      outline = Color(0xFF2E2E36),
                      surfaceContainerLow = Color(0xFF050505),
                      surfaceContainer = Color(0xFF0A0A0A),
                      surfaceContainerHigh = Color(0xFF121212),
                      surfaceContainerHighest = Color(0xFF1A1A1A)
                  )
              }
          }

          @Composable
          fun NexoraTheme(settings: ThemeSettings, content: @Composable () -> Unit) {
              val density = LocalDensity.current
              val systemFontScale = LocalConfiguration.current.fontScale
              val r = settings.cornerRadiusDp.toFloat()
              val shapes = Shapes(
                  extraSmall = RoundedCornerShape((r * 0.3f).dp),
                  small = RoundedCornerShape((r * 0.6f).dp),
                  medium = RoundedCornerShape(r.dp),
                  large = RoundedCornerShape((r * 1.2f).dp),
                  extraLarge = RoundedCornerShape((r * 1.6f).dp)
              )
              CompositionLocalProvider(
                  LocalDensity provides Density(density.density, systemFontScale * settings.fontScale)
              ) {
                  MaterialTheme(
                      colorScheme = buildColorScheme(settings),
                      shapes = shapes,
                      typography = Typography(),
                      content = content
                  )
              }
          }
          NEXORA_EOF

          cat > app/src/main/java/com/nexora/circle/ui/components/StageScreen.kt <<'NEXORA_EOF'
          package com.nexora.circle.ui.components

          import androidx.compose.foundation.layout.Arrangement
